{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">My Profile</h2>

<div class="card p-4">

    <h4>{{ user.username }}</h4>

    <p><strong>Email:</strong> {{ user.email }}</p>

    <p><strong>Date Joined:</strong> {{ user.date_joined }}</p>

    <hr>

    <h5>Total Orders: {{ total_orders }}</h5>

    <h5>Wishlist Items: {{ wishlist_count }}</h5>

</div>

{% endblock %}
