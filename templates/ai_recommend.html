{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            🤖 AI Beauty Recommendation
        </h2>

        <div class="mb-3">

            <label class="form-label">
                Select Your Skin Type
            </label>

            <select id="skin" class="form-select">

                <option value="oily">Oily</option>
                <option value="dry">Dry</option>
                <option value="all">All Skin</option>

            </select>

        </div>

        <button
            class="btn btn-primary w-100"
            onclick="getRecommendation()">

            Get AI Recommendation

        </button>

        <hr>

        <div id="result">

        </div>

    </div>

</div>

<script>

async function getRecommendation(){

    let skin = document.getElementById("skin").value;

    const response = await fetch(
        `http://127.0.0.1:8001/recommend?skin=${skin}`
    );

    const data = await response.json();

    let html = `<h4 class="mt-4">Recommended Products</h4>`;

    data.recommendations.forEach(product=>{

        html += `
            <div class="card mt-3 p-3">

                <h5>${product.name}</h5>

                <p>₹ ${product.price}</p>

            </div>
        `;

    });

    document.getElementById("result").innerHTML = html;

}

</script>

{% endblock %}
