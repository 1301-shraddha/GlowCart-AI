{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <h2 class="mb-4">
                Contact Us
            </h2>

            <p>
                We'd love to hear from you.
            </p>

            <hr>

            <h5>📍 Address</h5>

            <p>
                Pune, Maharashtra, India
            </p>

            <h5>📞 Phone</h5>

            <p>
                +91 9876543210
            </p>

            <h5>✉ Email</h5>

            <p>
                support@glowcart.com
            </p>

            <h5>🕒 Working Hours</h5>

            <p>
                Monday - Saturday <br>
                10:00 AM - 8:00 PM
            </p>

        </div>

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h3 class="mb-4 text-center">
                    Send Message
                </h3>

                <form>

                    <div class="mb-3">

                        <label>Name</label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter your name">

                    </div>

                    <div class="mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter your email">

                    </div>

                    <div class="mb-3">

                        <label>Message</label>

                        <textarea
                            rows="5"
                            class="form-control"
                            placeholder="Write your message..."></textarea>

                    </div>

                    <button class="btn btn-primary w-100">

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
